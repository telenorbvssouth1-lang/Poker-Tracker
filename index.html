<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poker Score Tracker</title>
<style>
:root{--bg:#06130c;--card:#0f2418;--ink:#e8f5ec;--mut:#86a894;--acc:#25a862;--acc2:#f2c14e;--red:#ef6a5b;--line:#1f3d2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes glow{50%{box-shadow:0 0 30px rgba(37,168,98,.6)}}@keyframes bounce{0%,100%{transform:none}40%{transform:translateY(-8px) scale(1.1)}}
button{transition:transform .15s,filter .15s}button:active{transform:scale(.95)}button:hover{filter:brightness(1.12)}
h1{background:linear-gradient(90deg,#7cf0b0,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#14402a,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:30px;margin:0 0 6px}h2{font-size:20px;margin:0 0 12px}
.card{background:linear-gradient(160deg,var(--card),#0a1b12);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:up .3s both}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.gold{background:var(--acc2);color:#2a1e00}button.red{background:var(--red)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.grid{display:grid;gap:8px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1fr 1fr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.home{text-align:center;padding-top:12vh}.home .suits{font-size:46px;margin-bottom:10px}.suits span{display:inline-block;margin:0 8px;animation:float 3s ease-in-out infinite}.suits span:nth-child(2){animation-delay:.4s;color:#ef6a5b}.suits span:nth-child(3){animation-delay:.8s}.suits span:nth-child(4){animation-delay:1.2s;color:#ef6a5b}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.pl{display:flex;align-items:center;gap:12px}
.avs{width:50px;height:50px;flex:none;border-radius:50%;animation:bob 3s ease-in-out infinite;box-shadow:0 0 0 2px var(--b),0 4px 12px rgba(0,0,0,.45)}.avs svg{display:block;border-radius:50%;width:100%;height:100%}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.avs.champ{animation:bounce .9s infinite;box-shadow:0 0 0 3px var(--acc2),0 0 18px var(--acc2)}.rk{position:absolute;right:-6px;bottom:-4px;background:var(--acc2);color:#2a1e00;font-size:12px;font-weight:800;border-radius:99px;padding:1px 6px}
.pl.fold{opacity:.55}.pl.fold .avs{animation:none;filter:grayscale(1) brightness(.8)}.pl.fold .m1,.pl:not(.fold) .m2,.z{display:none}.pl.fold .z{display:block;animation:float 1.6s infinite}
.bal{font-size:22px;font-weight:800}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.pot{text-align:center;background:linear-gradient(135deg,#1f9d5c,#0c5a33);color:#fff;border:0;animation:up .3s both,glow 2.6s infinite}.pot b{font-size:34px;display:block}
.pot.dim{opacity:.95}.d{color:var(--acc)}.n{color:var(--red)}
.log{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
</style></head><body><div id="app"></div>
<script>window.onerror=function(m){var a=document.getElementById('app');if(a)a.innerHTML='<pre style="padding:16px;white-space:pre-wrap;color:#e56b5d">Error: '+m+'</pre>'}</script>
<script>
(function(){
const $=s=>document.querySelector(s),app=$('#app'),L='ABCDEFGHIJ';
let S=null,setup={count:3,names:[...L].slice(0,3),bal:100},bidIn=10;
try{S=JSON.parse(localStorage.getItem('pokerS')||'null');if(S){S.fold=S.fold||{};S.con=S.con||{};S.inR=S.inR||[];S.log=S.log||[]}}catch(e){S=null}
const save=()=>{try{localStorage.setItem('pokerS',JSON.stringify(S))}catch(e){}};
const act=()=>S.inR.filter(i=>!S.fold[i]);
const pot=()=>S.inR.reduce((a,i)=>a+S.con[i],0);
const cap=ids=>Math.min(...ids.map(i=>S.p[i].bal));
const CH=[['#25a862','#f1c27d','#2b1b12',0,'sun'],['#3b82f6','#8d5524','#111',1,''],['#e879a8','#ffdbac','#7a3b1e',2,''],['#f59e0b','#c68642','#111',3,'mus'],['#a855f7','#f1c27d','#d94f4f',4,''],['#ef4444','#ffdbac','#111',5,'sun'],['#14b8a6','#8d5524','#3a2a1a',6,''],['#6366f1','#f1c27d','#ef4444',7,''],['#eab308','#c68642','#5a3a1a',8,'mus'],['#f43f5e','#ffdbac','#222',9,'']];
function av(i,c=''){const[b,sk,h,st,ac]=CH[i%10];const tp=`<path d='M11 24a13 12 0 0126 0q-13-5-26 0z' fill='${h}'/>`;
const H=[['',`<path d='M11 24a13 12 0 0126 0z' fill='${h}'/><rect x='9' y='22' width='30' height='4' rx='2' fill='${h}'/>`],['',`<polygon points='11,23 12,9 18,17 24,6 30,17 36,9 37,23' fill='${h}'/>`],[`<rect x='9' y='14' width='30' height='30' rx='13' fill='${h}'/>`,tp],['',`<ellipse cx='19' cy='17' rx='3' ry='1.5' fill='#fff' opacity='.35'/>`],['',tp+`<circle cx='24' cy='9' r='5' fill='${h}'/>`],['',`<rect x='21' y='4' width='6' height='14' rx='3' fill='${h}'/>`],['',[[14,18],[20,14],[28,14],[34,18]].map(q=>`<circle cx='${q[0]}' cy='${q[1]}' r='5' fill='${h}'/>`).join('')],['',`<path d='M11 24a13 12 0 0126 0z' fill='#e5e7eb'/><rect x='10' y='21' width='28' height='5' rx='2' fill='${h}'/><circle cx='24' cy='10' r='3.5' fill='${h}'/>`],['',`<ellipse cx='24' cy='18' rx='19' ry='4' fill='${h}'/><path d='M14 18q0-12 10-12t10 12z' fill='${h}'/>`],['',tp+`<rect x='11' y='19' width='26' height='3' fill='#f43f5e'/>`]][st];
const eyes=ac=='sun'?`<rect x='11' y='23' width='11' height='7' rx='3' fill='#111'/><rect x='26' y='23' width='11' height='7' rx='3' fill='#111'/><rect x='22' y='25' width='4' height='2' fill='#111'/>`:`<ellipse cx='18' cy='26' rx='2' ry='2.6' fill='#111'/><ellipse cx='30' cy='26' rx='2' ry='2.6' fill='#111'/>`;
const mus=ac=='mus'?`<path d='M16 33q4-3 8 0q4-3 8 0q-4 3-8 1q-4 2-8-1z' fill='${h}'/>`:'';
return `<div class='avs ${c}' style='animation-delay:${i*.3}s;--b:${b}'><svg viewBox='0 0 48 48'><circle cx='24' cy='24' r='24' fill='${b}'/>${H[0]}<ellipse cx='24' cy='27' rx='13' ry='14' fill='${sk}'/>${H[1]}<g class='eyes' style='animation-delay:${i*.45}s'>${eyes}</g>${mus}<path class='m1' d='M19 35q5 5 10 0' stroke='#111' fill='none' stroke-width='1.8' stroke-linecap='round'/><path class='m2' d='M20 36h8' stroke='#111' stroke-width='1.8' stroke-linecap='round'/><text class='z' x='33' y='13' font-size='10' font-weight='700' fill='#fff'>z</text></svg></div>`}
function card(i,body=''){const p=S.p[i];return `<div class="pl ${S.fold[i]?'fold':''}">${av(i,S.lastW===i&&S.phase=='bid'?'champ':'')}<div style="flex:1"><b>${esc(p.name)}</b> ${S.fold[i]?'<span class="tag">folded</span>':''}${S.inR&&S.phase=='play'&&!S.inR.includes(i)?'<span class="tag">out</span>':''}<div class="mut">${S.phase=='play'&&S.inR.includes(i)?'in pot: '+S.con[i]:''}</div></div><div class="bal">${p.bal}</div>${body}</div>`}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){app.innerHTML=`<div class="home"><div class="suits"><span>♠</span><span>♥</span><span>♣</span><span>♦</span></div><h1>Poker Score Tracker</h1><p class="mut">Track coins while you play with friends.</p><p><button onclick="goSetup()" style="font-size:20px;padding:16px 36px">Start Game</button></p>${S?'<p><button class="sec" onclick="S.phase==\'over\'?over():render()">Resume saved game</button></p>':''}</div>`}
function goSetup(){render0('setup')}
function render0(v){v=='setup'?setupV():home()}
function setupV(){const c=setup.count;while(setup.names.length<c)setup.names.push(L[setup.names.length]);
app.innerHTML=`<h2>How many players?</h2><div class="card"><div class="chips">${[2,3,4,5,6,7,8,9,10].map(n=>`<button class="chip ${n==c?'on':''}" onclick="setup.count=${n};setupV()">${n}</button>`).join('')}</div></div>
<h2>Player names</h2><div class="card grid">${setup.names.slice(0,c).map((n,i)=>`<div class="pl">${av(i)}<input value="${esc(n)}" maxlength="14" oninput="setup.names[${i}]=this.value"></div>`).join('')}</div>
<h2>Starting balance per player</h2><div class="card"><input type="number" min="1" value="${setup.bal}" oninput="setup.bal=+this.value"></div>
<div class="grid g2"><button class="sec" onclick="home()">Back</button><button onclick="begin()">Start Game</button></div>`}
function begin(){const b=Math.max(1,Math.floor(setup.bal)||100),c=setup.count;
S={p:setup.names.slice(0,c).map((n,i)=>({name:n.trim()||L[i],bal:b})),round:0,phase:'bid',log:[],start:b,fold:{},con:{},inR:[]};save();render()}
function render(){if(!S)return home();if(S.phase=='over')return over();S.phase=='bid'?bidV():playV()}
function bidV(){const alive=S.p.map((p,i)=>i).filter(i=>S.p[i].bal>0);
if(alive.length<2)return over();const mx=Math.min(100,cap(alive));if(bidIn>mx)bidIn=mx;
app.innerHTML=`<div class="row sp"><h2>Round ${S.round+1}</h2><button class="sec" onclick="over()">End game</button></div>
<div class="card grid">${S.p.map((p,i)=>S.p[i].bal>0?card(i):'').join('')}</div>
<div class="card"><b>Opening bid</b> <span class="mut">(1 – ${mx}, every player puts this in)</span>
<div class="chips" style="margin:10px 0">${[1,5,10,25,50,100].filter(v=>v<=mx).map(v=>`<button class="chip ${bidIn==v?'on':''}" onclick="bidIn=${v};bidV()">${v}</button>`).join('')}</div>
<input type="range" min="1" max="${mx}" value="${bidIn}" oninput="bidIn=+this.value;$('#bv').value=bidIn">
<input id="bv" type="number" min="1" max="${mx}" value="${bidIn}" style="margin-top:8px" onchange="bidIn=Math.max(1,Math.min(${mx},+this.value||1));bidV()">
<p><button style="width:100%" onclick="startRound(${mx})">Start Round</button></p></div>
${S.snap?'<button class="sec" onclick="undo()">↩ Undo last round</button>':''}${logV()}`}
function startRound(mx){const alive=S.p.map((p,i)=>i).filter(i=>S.p[i].bal>0);
S.inR=alive;S.bid=Math.max(1,Math.min(mx,bidIn));S.fold={};S.con={};alive.forEach(i=>S.con[i]=S.bid);S.phase='play';save();render()}
function playV(){const a=act(),mx=cap(a);
app.innerHTML=`<div class="row sp"><h2>Round ${S.round+1}</h2><span class="mut">Bid: ${S.bid}</span></div>
<div class="card pot"><span>Pot</span><b>${pot()}</b></div>
<div class="card"><b>Raise bid</b> <span class="mut">(up to ${mx})</span><div class="row" style="margin-top:8px"><input id="rv" type="number" min="${S.bid+1}" max="${mx}" value="${Math.min(mx,S.bid+5)}"><button class="gold" ${S.bid>=mx?'disabled':''} onclick="raise()">Raise</button></div></div>
<div class="card grid">${S.p.map((p,i)=>{if(!S.inR.includes(i))return card(i);if(S.fold[i])return card(i);
return card(i,`<div class="grid"><button class="red" style="padding:8px 12px" onclick="fold(${i})">Fold</button><button style="padding:8px 12px" onclick="win(${i})">Wins 🏆</button></div>`)}).join('')}</div>
<p class="mut">Folded players keep the bid they folded at. Tap "Wins" for the player who takes the pot.</p>`}
function raise(){const a=act(),mx=cap(a),v=Math.floor(+$('#rv').value);if(!(v>S.bid&&v<=mx))return alert('Raise must be more than '+S.bid+' and at most '+mx);
S.bid=v;a.forEach(i=>S.con[i]=v);save();render()}
function fold(i){S.fold[i]=true;S.con[i]=S.bid;const a=act();save();if(a.length==1)win(a[0]);else render()}
function win(w){S.snap={p:JSON.parse(JSON.stringify(S.p)),round:S.round,log:[...S.log]};const P=pot(),ch=[];
S.inR.forEach(i=>{S.p[i].bal-=S.con[i]});S.p[w].bal+=P;
S.log.unshift(`Round ${S.round+1}: ${S.p[w].name} won pot ${P} (net +${P-S.con[w]})`);
S.round++;S.lastW=w;S.phase='bid';S.fold={};S.con={};S.inR=[];save();render()}
function undo(){if(!S.snap)return;S.p=S.snap.p;S.round=S.snap.round;S.log=S.snap.log;S.snap=null;S.lastW=null;save();render()}
function logV(){return S.log.length?`<div class="card"><b>History</b>${S.log.slice(0,15).map(l=>`<div class="log">${esc(l)}</div>`).join('')}</div>`:''}
function over(){S.phase='over';save();const r=S.p.map((p,i)=>({...p,i})).sort((a,b)=>b.bal-a.bal);
app.innerHTML=`<h1>🏆 Scoreboard</h1><p class="mut">After ${S.round} round${S.round==1?'':'s'}</p><div class="card grid">${r.map((p,k)=>{const d=p.bal-S.start;return `<div class="pl"><div style="position:relative">${av(p.i,k==0?'champ':'')}<span class="rk">${k==0?'👑':k+1}</span></div><div style="flex:1"><b>${esc(p.name)}</b><div class="${d>=0?'d':'n'}">${d>=0?'+':''}${d}</div></div><div class="bal">${p.bal}</div></div>`}).join('')}</div>
<div class="grid g2"><button class="sec" onclick="S.phase='bid';save();render()">Keep playing</button><button onclick="newGame()">New game</button></div>${logV()}`}
function newGame(){S=null;try{localStorage.removeItem('pokerS')}catch(e){}home()}
S?render():home();
const W=window;
Object.assign(W,{goSetup,home,setupV,bidV,over,render,begin,startRound,raise,fold,win,undo,newGame});
W.$=$;
[['S',()=>S,v=>S=v],['setup',()=>setup,v=>setup=v],['bidIn',()=>bidIn,v=>bidIn=v]].forEach(([n,g,s])=>Object.defineProperty(W,n,{get:g,set:s,configurable:true}));
})();
</script></body></html>
